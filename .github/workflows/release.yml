name: Release

on:
  push:
    tags:
      - 'v*.*.*' 

permissions:
  contents: write 

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Run Unit Test
        run: npm run test

      - name: Zip Artifacts
        run: |
          zip -r web-app-bundle.zip dist/

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            ./web-app-bundle.zip \
            --title "USTP CI/CD Tetris ${{ github.ref_name }}" \
            --generate-notes
